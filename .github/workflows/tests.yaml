name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-homeassistant-custom-component
      - name: Lint with ruff
        run: ruff check .
      - name: Check formatting with ruff
        run: ruff format . --check
      - name: Type check with mypy
        run: mypy custom_components/eversports
      - name: Run tests with pytest
        run: pytest tests
